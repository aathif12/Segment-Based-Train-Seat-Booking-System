version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: lfs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lfsrailway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lfs} -d ${POSTGRES_DB:-lfsrailway}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lfs_net

  # ── Go Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lfs_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lfs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lfsrailway}?sslmode=disable
      PORT: "8080"
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - lfs_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Seeder (runs once, then exits) ───────────────────────────────────────────
  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lfs_seeder
    entrypoint: ["./seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lfs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lfsrailway}?sslmode=disable
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    networks:
      - lfs_net

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lfs_frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - backend
    networks:
      - lfs_net

volumes:
  postgres_data:
    name: lfs_postgres_data

networks:
  lfs_net:
    name: lfs_railway_network
